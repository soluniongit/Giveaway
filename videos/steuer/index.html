    <div class="doc-lines"><i style="width:88%"></i><i style="width:66%"></i><i style="width:78%"></i></div>
    <div class="doc-corner"></div>
    <div class="doc-seal"><svg viewBox="0 0 30 30"><path d="M8 15.5 L13 20.5 L22.5 10" fill="none" stroke="#b69a5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>`;
['doc0', 'doc1', 'doc2'].forEach((id, i) => {
  document.getElementById(id).insertAdjacentHTML('afterbegin', docInner(C.years[i]));
});

gsap.registerPlugin(DrawSVGPlugin);

defineComposition({
  duration: 30,
  fps: 30,
  build() {
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => [...document.querySelectorAll(s)];
    const inner = (sel) => $$(sel).map((el) => el.firstElementChild);

    // ---------- Initial states ----------
    const masked = [
      '#hdr .lbl', '#s1-three', '#s1-jahre', '#s1-l2', '#s1-l3', '#s2-top', '#s2-bot',
      '#row1 .t', '#row1 .s', '#row2 .t', '#row2 .s', '#hint .k', '#hint .t',
      '#s4-title', '#st1 .n', '#st1 .t', '#st2 .n', '#st2 .t', '#st3 .n', '#st3 .t', '#free .t', '#free .s',
      '#e-l1', '#e-l2', '#e-l3', '#cta .t', '#e-meta', '#e-meta2',
    ];
    gsap.set(inner(masked.join(',')), { yPercent: 135 });
    gsap.set('#hdr .dot', { scale: 0 });
    gsap.set('#hdr .rule', { scaleX: 0 });
    gsap.set('#hdr .count', { opacity: 0 });

    // Cards: fanned below the headline, off-screen at start
    const fan = [
      { left: 168, top: 1418, rotation: -11 },
      { left: 400, top: 1376, rotation: 0 },
      { left: 632, top: 1418, rotation: 11 },
    ];
    ['#doc0', '#doc1', '#doc2'].forEach((id, i) => gsap.set(id, { ...fan[i], y: 700, width: 280, height: 372 }));
    gsap.set('#detail', { opacity: 0 });
    gsap.set('#frame-rect', { drawSVG: '0%' });
    gsap.set('#badge', { scale: 0.6, opacity: 0 });
    gsap.set('#row1 .c-fill, #row2 .c-fill', { scale: 0, transformOrigin: '50% 50%' });
    gsap.set('#row1 .c-mark', { drawSVG: '0%' });
    gsap.set('#row1 .c-ring, #row2 .c-ring', { drawSVG: '0%' });
    gsap.set('#row2 .plane', { opacity: 0, x: -26, y: 22 });
    gsap.set('#plus .pl-a, #plus .pl-b', { drawSVG: '0%' });
    gsap.set('#plus .pl-c', { scale: 0, transformOrigin: '50% 50%' });
    gsap.set('.detail-rule', { scaleX: 0 });
    gsap.set('#hint', { y: 120, opacity: 0 });
    gsap.set('#steps .track', { scaleY: 0, transformOrigin: '50% 0' });
    gsap.set('#fill1, #fill2', { scaleY: 0 });
    gsap.set('.node', { scale: 0.4, opacity: 0 });
    gsap.set('.node .on', { scale: 0 });
    gsap.set('.node .ring', { scale: 1, opacity: 0 });
    gsap.set('.node .ico', { stroke: '#b9b3a5' });
    gsap.set('.mailcheck', { scale: 0, transformOrigin: '60px 56px' });
    gsap.set('#free', { y: 90, opacity: 0 });
    gsap.set('#free .ic', { scale: 0 });
    gsap.set('#logo-badge', { y: 50, opacity: 0, scale: 0.94 });
    gsap.set('#cta', { scaleX: 0.25, opacity: 0 });
    gsap.set('#cta .arr', { scale: 0 });

    const tl = gsap.timeline({ defaults: { ease: 'expo.out', duration: 1 } });
    const reveal = (sel, at, o = {}) => tl.to(inner(sel), { yPercent: 0, duration: 1.05, ease: 'expo.out', stagger: 0.09, ...o }, at);
    const hide = (sel, at, o = {}) => tl.to(sel, { y: -70, opacity: 0, duration: 0.38, ease: 'power2.in', stagger: 0.035, ...o }, at);
    const count = (i, at) => tl.to('#hdr .strip', { y: -34 * i, duration: 0.7, ease: 'expo.inOut' }, at);

    // Ambient light drift — stops at 27 s so the last 3 s are fully static
    tl.to('#blobA', { x: 260, y: 220, duration: 27, ease: 'sine.inOut' }, 0);
    tl.to('#blobB', { x: -300, y: -260, duration: 27, ease: 'sine.inOut' }, 0);

    // ---------- 0–4 s · Hook ----------
    tl.to('#hdr .dot', { scale: 1, duration: 0.6, ease: 'back.out(2.2)' }, 0.1);
    reveal('#hdr .lbl', 0.18);
    tl.to('#hdr .rule', { scaleX: 1, duration: 1.4, ease: 'expo.inOut' }, 0.3);
    tl.to('#hdr .count', { opacity: 1, duration: 0.5, ease: 'power1.out' }, 0.9);

    tl.to(inner('#s1-three'), { yPercent: 0, duration: 1.3, ease: 'expo.out' }, 0.25);
    tl.fromTo('#s1-three span', { scale: 1.12, transformOrigin: '30% 90%' }, { scale: 1, duration: 1.8, ease: 'expo.out', immediateRender: false }, 0.25);
    tl.to('.gold-text', { backgroundPosition: '100% 0', duration: 2.4, ease: 'sine.inOut' }, 1.0);

    tl.to(['#doc0', '#doc1', '#doc2'], { y: 0, duration: 1.25, ease: 'expo.out', stagger: 0.09 }, 0.75);
    reveal('#s1-jahre', 0.95);
    reveal('#s1-l2', 1.55);
    reveal('#s1-l3', 2.15);

    // ---------- 4–10 s · Der Gewinn ----------
    hide(['#s1-three', '#s1-jahre', '#s1-l2', '#s1-l3'], 3.85);
    count(1, 3.95);
    const row = [{ left: 94, top: 774 }, { left: 400, top: 774 }, { left: 706, top: 774 }];
    ['#doc0', '#doc1', '#doc2'].forEach((id, i) => tl.to(id, { ...row[i], rotation: 0, duration: 1.15, ease: 'expo.inOut' }, 4.0 + i * 0.05));
    reveal('#s2-top', 4.55);
    tl.to('#frame-rect', { drawSVG: '100%', duration: 1.3, ease: 'power3.inOut' }, 5.15);
    tl.to('#badge', { scale: 1, opacity: 1, duration: 0.7, ease: 'back.out(1.8)' }, 6.05);
    reveal('#s2-bot', 6.5);

    // ---------- 10–16 s · Was ist inklusive ----------
    hide(['#s2-top', '#badge', '#s2-bot'], 9.6);
    tl.to('#frame-rect', { drawSVG: '50% 50%', opacity: 0, duration: 0.5, ease: 'power2.in' }, 9.65);
    count(2, 9.75);
    tl.to('#doc0', { x: -520, opacity: 0, rotation: -8, duration: 0.8, ease: 'power3.in' }, 9.7);
    tl.to('#doc2', { x: 520, opacity: 0, rotation: 8, duration: 0.8, ease: 'power3.in' }, 9.7);
    tl.to('#doc1 .doc-in', { opacity: 0, duration: 0.3, ease: 'power1.in' }, 9.75);
    tl.to('#doc1', { left: 120, top: 470, width: 840, height: 600, borderRadius: 40, duration: 1.15, ease: 'expo.inOut' }, 9.85);
    tl.to('#detail', { opacity: 1, duration: 0.01 }, 10.6);
    tl.to('.detail-top', { opacity: 0, duration: 0.01 }, 0); // hidden until reveal
    tl.to('.detail-top', { opacity: 1, duration: 0.5, ease: 'power1.out' }, 10.65);
    tl.to('.detail-rule', { scaleX: 1, duration: 1.0, ease: 'expo.inOut' }, 10.65);

    tl.to('#row1 .c-ring', { drawSVG: '100%', duration: 0.8, ease: 'power3.inOut' }, 10.8);
    reveal('#row1 .t, #row1 .s', 10.9);
    tl.to('#row1 .c-fill', { scale: 1, duration: 0.55, ease: 'back.out(1.6)' }, 11.45);
    tl.to('#row1 .c-mark', { drawSVG: '100%', duration: 0.45, ease: 'power2.out' }, 11.7);

    tl.to('#plus .pl-a', { drawSVG: '100%', duration: 0.35, ease: 'power2.out' }, 11.55);
    tl.to('#plus .pl-c', { scale: 1, duration: 0.5, ease: 'back.out(2)' }, 11.75);
    tl.to('#plus .pl-b', { drawSVG: '100%', duration: 0.35, ease: 'power2.out' }, 11.9);

    tl.to('#row2 .c-ring', { drawSVG: '100%', duration: 0.8, ease: 'power3.inOut' }, 11.9);
    reveal('#row2 .t, #row2 .s', 12.0);
    tl.to('#row2 .c-fill', { scale: 1, duration: 0.55, ease: 'back.out(1.6)' }, 12.55);
    tl.to('#row2 .plane', { opacity: 1, x: 0, y: 0, duration: 0.7, ease: 'expo.out' }, 12.75);

    tl.to('#hint', { y: 0, opacity: 1, duration: 1.0, ease: 'expo.out' }, 13.25);
    reveal('#hint .k, #hint .t', 13.45);
    // small "send" gesture on the plane
    tl.to('#row2 .plane', { x: 7, y: -7, duration: 0.45, ease: 'power2.out' }, 14.3);
    tl.to('#row2 .plane', { x: 0, y: 0, duration: 0.7, ease: 'power2.inOut' }, 14.75);

    // ---------- 16–23 s · So machst du mit ----------
    hide(['#doc1', '#hint'], 15.6, { y: -90, stagger: 0.06 });
    count(3, 15.75);
    reveal('#s4-title', 16.05);
    tl.to('#steps .track', { scaleY: 1, duration: 1.2, ease: 'expo.inOut' }, 16.2);
    tl.to('.node', { scale: 1, opacity: 1, duration: 0.8, ease: 'back.out(1.5)', stagger: 0.12 }, 16.25);
    reveal('#st1 .n, #st1 .t, #st2 .n, #st2 .t, #st3 .n, #st3 .t', 16.4, { stagger: 0.06 });
    tl.to('.step-txt .t span', { color: '#c2bdb0', duration: 0.01 }, 16.35);

    const activate = (n, at) => {
      tl.to(`#node${n} .on`, { scale: 1, duration: 0.6, ease: 'expo.out' }, at);
      tl.to(`#node${n} .ico`, { stroke: '#fffefb', duration: 0.3, ease: 'power1.out' }, at + 0.05);
      tl.to(`#node${n}`, { scale: 1.08, duration: 0.25, ease: 'power2.out' }, at);
      tl.to(`#node${n}`, { scale: 1, duration: 0.6, ease: 'elastic.out(1, 0.5)' }, at + 0.25);
      tl.to(`#node${n} .ring`, { opacity: 0.9, duration: 0.01 }, at);
      tl.to(`#node${n} .ring`, { scale: 1.55, opacity: 0, duration: 1.0, ease: 'power2.out' }, at + 0.02);
      tl.to(`#st${n} .t span`, { color: '#111512', duration: 0.4, ease: 'power1.out' }, at + 0.05);
    };
    activate(1, 17.0);
    tl.to('#fill1', { scaleY: 1, duration: 1.0, ease: 'power2.inOut' }, 17.55);
    activate(2, 18.45);
    tl.to('#fill2', { scaleY: 1, duration: 1.0, ease: 'power2.inOut' }, 19.0);
    activate(3, 19.9);
    tl.to('.mailcheck', { scale: 1, duration: 0.6, ease: 'back.out(2.4)' }, 20.3);

    tl.to('#free', { y: 0, opacity: 1, duration: 1.0, ease: 'expo.out' }, 20.85);
    tl.to('#free .ic', { scale: 1, duration: 0.6, ease: 'back.out(2)' }, 21.1);
    reveal('#free .t, #free .s', 21.05);

    // ---------- 23–30 s · Endkarte ----------
    hide(['#hdr', '#s4-title', '#steps', '#free'], 22.9, { stagger: 0.05 });
    tl.to('#logo-badge', { y: 0, opacity: 1, scale: 1, duration: 1.1, ease: 'expo.out' }, 23.45);
    reveal('#e-l1', 23.7);
    reveal('#e-l2', 23.85);
    reveal('#e-l3', 24.0);
    tl.to('#cta', { scaleX: 1, opacity: 1, duration: 1.1, ease: 'expo.out' }, 24.45);
    reveal('#cta .t', 24.75);
    tl.to('#cta .arr', { scale: 1, duration: 0.6, ease: 'back.out(2)' }, 24.95);
    reveal('#e-meta, #e-meta2', 25.2);
    // final sheen on the gold, then everything rests (static from 27 s)
    tl.fromTo('#e-l1 .gold-text, #e-l3 .gold-text', { backgroundPosition: '0% 0' }, { backgroundPosition: '100% 0', duration: 1.6, ease: 'sine.inOut', immediateRender: false }, 25.2);
    tl.to({}, { duration: 0.01 }, 30);
    return tl;
  },
});
</script>
</body>
</html>
