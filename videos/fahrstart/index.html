  end_prize: '2 × 2 Fahrlektionen à 50 Min. + 1 VKU-Kursplatz',
  cta: 'Jetzt teilnehmen',
  end_meta: 'Bis 29.11.2026 • ab 18 • Wohnsitz ZH, SZ, ZG oder SG',
  end_meta2: 'Alle Gewinne & Teilnahmebedingungen im Link',
};

applyTexts(C);
gsap.registerPlugin(DrawSVGPlugin);

/* Gold route through all five scenes (world coordinates, 1080 × 9600). */
const ROUTE = [
  'M -60 1380',
  'C 240 1380, 520 1520, 800 1490',      // swoosh under the S1 headline
  'C 1060 1462, 1080 1700, 830 1760',
  'C 600 1815, 40 1800, 40 2060',        // → left rail into S2
  'L 40 2190',
  'C 40 2290, 540 2240, 540 2340',       // into the gap between the prize cards
  'L 540 2930',                          // … through the "+"
  'C 540 3010, 1040 2980, 1040 3080',    // corridor above the VKU definition
  'L 1040 3330',
  'C 1040 3600, 40 3560, 40 3860',       // S-curve into S3
  'L 40 4440',
  'C 40 4520, 140 4510, 140 4600',       // onto the station line
  'L 140 5130',
  'C 140 5200, 40 5190, 40 5260',
  'L 40 6060',
  'C 40 6180, 540 6140, 540 6260',       // into the form
  'L 540 6560',
  'C 540 6720, 1040 6680, 1040 6880',    // out to the right rail
  'L 1040 8460',
  'C 1040 8640, 1010 8765, 880 8765',    // ends at the CTA arrow (S5)
].join(' ');

defineComposition({
  duration: 30,
  fps: 30,
  build() {
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => [...document.querySelectorAll(s)];
    const inner = (sel) => $$(sel).map((el) => el.firstElementChild);

    const line = $('#road-line');
    const glow = $('#road-glow');
    line.setAttribute('d', ROUTE);
    glow.setAttribute('d', ROUTE);
    const total = line.getTotalLength();

    // Path length at which the route first reaches world-y ≥ y (linear scan; the S1 swoosh is not monotonic)
    const lenAtY = (y) => {
      for (let l = 0; l <= total; l += 2) if (line.getPointAtLength(l).y >= y) return l;
      return total;
    };
    const S1_END = lenAtY(1790);                    // after the swoosh, before leaving S1
    const route = { len: 0 };
    const head = $('#head');

    // Stations sit exactly on the route
    ['#vc1', '#vc2', '#vc3'].forEach((id, i) => {
      const st = document.createElement('div');
      st.className = 'station';
      st.id = 'st' + (i + 1);
      st.innerHTML = '<div class="base"></div><div class="lit"></div><svg viewBox="0 0 50 56"><path d="M25 53 C25 53 5 33 5 20 A20 20 0 1 1 45 20 C45 33 25 53 25 53 Z" fill="none" stroke="#f8f6f0" stroke-width="4.5" stroke-linejoin="round"/><circle cx="25" cy="20" r="6.5" fill="#f8f6f0"/></svg>';
      st.style.left = 140 - 50 + 'px';
      st.style.top = 3840 + 680 + i * 240 + 95 - 50 + 'px';
      $('#world').appendChild(st);
    });

    // ---------- Initial states ----------
    gsap.set(inner([
      '#hdr .lbl', '#s1-k1', '#s1-k2', '#s1-h1', '#s1-h2', '#s1-h3',
      '#pcA .qty', '#pcA .name', '#pcA .sub', '#pcB .qty', '#pcB .name', '#pcB .sub', '#vku .w', '#s2-note',
      '#s3-title', '#s3-title2', '#s3-sub', '#s3-sub2', '#s4-a', '#s4-b',
      '#e1', '#e2', '#e-prize', '#cta .t', '#e-meta', '#e-meta2',
    ].join(',')), { yPercent: 135 });
    gsap.set('#hdr .dot', { scale: 0 });
    gsap.set('#hdr .rule', { scaleX: 0 });
    gsap.set('#hdr .count', { opacity: 0 });
    gsap.set('#lplate', { scale: 0.5, rotation: -14, opacity: 0 });
    gsap.set('#lplate path', { drawSVG: '0%' });
    gsap.set('.pcard', { y: 160, opacity: 0 });
    gsap.set('.pcard .draw > *', { drawSVG: '0%' });
    gsap.set('.pcard .foot', { scaleX: 0 });
    gsap.set('#pplus', { scale: 0, rotation: -90, transformOrigin: '50% 50%' });
    gsap.set('#vku .chip', { scale: 0.6, opacity: 0 });
    gsap.set('#vku .eq', { opacity: 0, x: -20 });
    gsap.set('.vcard', { x: 140, opacity: 0 });
    gsap.set('.station', { scale: 0.3, opacity: 0 });
    gsap.set('.station .lit', { scale: 0 });
    gsap.set('#sel-rect', { drawSVG: '0%' });
    gsap.set('.vcard .ok', { scale: 0, transformOrigin: '50% 50%' });
    gsap.set('#mail', { scale: 0.85, opacity: 0, y: 60 });
    gsap.set('#mail .fi i', { scaleX: 0 });
    gsap.set('#flap', { drawSVG: '0%' });
    gsap.set('#mailcheck', { scale: 0, transformOrigin: '50% 50%' });
    gsap.set('#mc-path', { drawSVG: '0%' });
    gsap.set('#s4-arr', { opacity: 0, x: -30 });
    gsap.set('.pill', { y: 50, opacity: 0 });
    gsap.set('#logo', { y: 40, opacity: 0 });
    gsap.set('#cta', { scaleX: 0.08, opacity: 0 });
    gsap.set('#cta .arr', { scale: 0 });

    const tl = gsap.timeline({ defaults: { ease: 'expo.out', duration: 1 } });
    const reveal = (sel, at, o = {}) => tl.to(inner(sel), { yPercent: 0, duration: 1.05, ease: 'expo.out', stagger: 0.09, ...o }, at);
    const count = (i, at) => tl.to('#hdr .strip', { y: -34 * i, duration: 0.7, ease: 'expo.inOut' }, at);
    const camera = (k, at) => {
      tl.to('#world', { y: -1920 * k, duration: 1.15, ease: 'power3.inOut' }, at);
      tl.to('#blobA', { y: -260 * k, x: 120 * (k % 2 ? 1 : -1), duration: 1.4, ease: 'power2.inOut' }, at);
      tl.to('#blobB', { y: -200 * k, duration: 1.4, ease: 'power2.inOut' }, at);
    };
    const drawTo = (len, at, dur, ease = 'power1.inOut') => tl.to(route, { len, duration: dur, ease }, at);

    // ---------- 0–4 s · Hook ----------
    drawTo(S1_END, 0.05, 2.1, 'power2.inOut');
    tl.to('#hdr .dot', { scale: 1, duration: 0.6, ease: 'back.out(2.2)' }, 0.15);
    reveal('#hdr .lbl', 0.2);
    tl.to('#hdr .rule', { scaleX: 1, duration: 1.4, ease: 'expo.inOut' }, 0.3);
    tl.to('#hdr .count', { opacity: 1, duration: 0.5, ease: 'power1.out' }, 0.9);
    tl.to('#lplate', { scale: 1, rotation: 0, opacity: 1, duration: 1.0, ease: 'back.out(1.6)' }, 0.35);
    tl.to('#lplate path', { drawSVG: '100%', duration: 0.6, ease: 'power2.inOut' }, 0.6);
    reveal('#s1-h1', 0.55);
    reveal('#s1-h2', 0.9);
    reveal('#s1-h3', 1.25);
    reveal('#s1-k1', 1.6);
    reveal('#s1-k2', 1.75);
    tl.to('.gold-text', { backgroundPosition: '100% 0', duration: 2.4, ease: 'sine.inOut' }, 1.2);

    // ---------- 4–10 s · Gewinne ----------
    camera(1, 3.85);
    count(1, 3.95);
    drawTo(lenAtY(2600), 3.85, 2.2, 'power2.inOut');
    tl.to('#pcA', { y: 0, opacity: 1, duration: 1.1, ease: 'expo.out' }, 4.45);
    tl.to('#pcB', { y: 0, opacity: 1, duration: 1.1, ease: 'expo.out' }, 4.6);
    tl.to('#pcA .draw > *', { drawSVG: '100%', duration: 1.0, ease: 'power2.inOut', stagger: 0.08 }, 4.75);
    tl.to('#pcB .draw > *', { drawSVG: '100%', duration: 1.0, ease: 'power2.inOut', stagger: 0.08 }, 4.9);
    reveal('#pcA .qty, #pcA .name, #pcA .sub', 4.85, { stagger: 0.08 });
    reveal('#pcB .qty, #pcB .name, #pcB .sub', 5.0, { stagger: 0.08 });
    tl.to('#pplus', { scale: 1, rotation: 0, duration: 0.8, ease: 'back.out(1.8)' }, 5.3);
    tl.to('.pcard .foot', { scaleX: 1, duration: 1.1, ease: 'expo.inOut', stagger: 0.1 }, 5.4);
    tl.to('#vku .chip', { scale: 1, opacity: 1, duration: 0.7, ease: 'back.out(1.8)' }, 6.25);
    tl.to('#vku .eq', { opacity: 1, x: 0, duration: 0.5, ease: 'power2.out' }, 6.55);
    reveal('#vku .w', 6.65);
    reveal('#s2-note', 7.2);
    drawTo(lenAtY(3300), 6.1, 1.6, 'power1.inOut');

    // ---------- 10–16 s · Anbieter wählen ----------
    camera(2, 9.75);
    count(2, 9.85);
    drawTo(lenAtY(4560), 9.6, 1.4, 'power2.inOut');
    reveal('#s3-title', 10.3);
    reveal('#s3-title2', 10.45);
    tl.to('.vcard', { x: 0, opacity: 1, duration: 1.0, ease: 'expo.out', stagger: 0.12 }, 10.55);
    tl.to('.station', { scale: 1, opacity: 1, duration: 0.6, ease: 'back.out(2)', stagger: 0.12 }, 10.75);
    // route runs through the stations, lighting each one
    const stY = (i) => 3840 + 680 + i * 240 + 95;
    drawTo(lenAtY(stY(0)), 11.0, 0.35, 'power1.in');
    tl.to('#st1 .lit', { scale: 1, duration: 0.45, ease: 'back.out(2)' }, 11.3);
    drawTo(lenAtY(stY(1)), 11.35, 0.5, 'none');
    tl.to('#st2 .lit', { scale: 1, duration: 0.45, ease: 'back.out(2)' }, 11.8);
    drawTo(lenAtY(stY(2)), 11.85, 0.5, 'none');
    tl.to('#st3 .lit', { scale: 1, duration: 0.45, ease: 'back.out(2)' }, 12.3);
    drawTo(lenAtY(5560), 12.35, 0.9, 'power1.out');
    // selection
    tl.to('#vc1, #vc3', { opacity: 0.42, duration: 0.6, ease: 'power2.out' }, 12.7);
    tl.to('#st1, #st3', { opacity: 0.5, duration: 0.6, ease: 'power2.out' }, 12.7);
    tl.to('#vc2', { scale: 1.035, duration: 0.7, ease: 'back.out(1.6)' }, 12.7);
    tl.to('#sel-rect', { drawSVG: '100%', duration: 1.0, ease: 'power3.inOut' }, 12.75);
    tl.to('#vc2 .ok', { scale: 1, duration: 0.6, ease: 'back.out(2.2)' }, 13.5);
    reveal('#s3-sub', 13.6);
    reveal('#s3-sub2', 13.8);

    // ---------- 16–23 s · Teilnehmen ----------
    camera(3, 15.75);
    count(3, 15.85);
    drawTo(lenAtY(6240), 15.6, 1.5, 'power2.inOut');
    tl.to('#mail', { scale: 1, opacity: 1, y: 0, duration: 1.0, ease: 'expo.out' }, 16.35);
    reveal('#s4-a', 16.6);
    tl.to('#mail .fi i', { scaleX: 1, duration: 0.55, ease: 'power3.out', stagger: 0.38 }, 16.95);
    tl.to('#mail .btn', { scale: 0.94, duration: 0.15, ease: 'power2.out' }, 18.2);
    tl.to('#mail .btn', { scale: 1, duration: 0.3, ease: 'power2.out' }, 18.35);
    // form folds into an envelope
    tl.to('#mail .fields', { opacity: 0, y: -40, duration: 0.35, ease: 'power2.in' }, 18.55);
    tl.to('#mail', { left: 280, top: 520, width: 520, height: 360, borderRadius: 34, duration: 0.85, ease: 'expo.inOut' }, 18.6);
    tl.to('#flap', { drawSVG: '100%', duration: 0.6, ease: 'power2.inOut' }, 19.25);
    tl.to('#s4-arr', { opacity: 1, x: 0, duration: 0.6, ease: 'expo.out' }, 19.35);
    reveal('#s4-b', 19.45);
    tl.to('#mailcheck', { left: 724, top: 794, duration: 0.01 }, 19.7);
    tl.to('#mailcheck', { scale: 1, duration: 0.7, ease: 'back.out(2.4)' }, 19.75);
    tl.to('#mc-path', { drawSVG: '100%', duration: 0.45, ease: 'power2.out' }, 20.0);
    drawTo(lenAtY(7300), 19.3, 1.8, 'power1.inOut');
    tl.to('#pill1', { y: 0, opacity: 1, duration: 0.9, ease: 'expo.out' }, 20.5);
    tl.to('#pill2', { y: 0, opacity: 1, duration: 0.9, ease: 'expo.out' }, 20.65);

    // ---------- 23–30 s · Endkarte ----------
    tl.to('#hdr', { opacity: 0, y: -30, duration: 0.4, ease: 'power2.in' }, 22.7);
    camera(4, 22.85);
    drawTo(total, 22.85, 1.75, 'power2.inOut');
    tl.to('#logo', { y: 0, opacity: 1, duration: 1.1, ease: 'expo.out' }, 23.55);
    reveal('#e1', 23.75);
    reveal('#e2', 23.9);
    tl.to('#head .core', { opacity: 0, scale: 0.4, duration: 0.3, ease: 'power2.in' }, 24.45);
    tl.to('#cta', { scaleX: 1, opacity: 1, duration: 1.05, ease: 'expo.out' }, 24.5);
    tl.to('#cta .arr', { scale: 1, duration: 0.6, ease: 'back.out(2)' }, 24.55);
    reveal('#cta .t', 24.85);
    reveal('#e-prize', 25.0);
    reveal('#e-meta, #e-meta2', 25.2);
    tl.fromTo('#e2 .gold-text', { backgroundPosition: '0% 0' }, { backgroundPosition: '100% 0', duration: 1.5, ease: 'sine.inOut', immediateRender: false }, 25.2);
    tl.to({}, { duration: 0.01 }, 30);

    const onSeek = () => {
      const L = Math.max(0.001, route.len);
      const dash = `${L} ${total + 20}`;
      line.style.strokeDasharray = dash;
      glow.style.strokeDasharray = dash;
      const p = line.getPointAtLength(L);
      head.style.left = p.x + 'px';
      head.style.top = p.y + 'px';
      head.style.visibility = route.len < 2 ? 'hidden' : 'visible';
    };
    return { timeline: tl, onSeek };
  },
});
</script>
</body>
</html>
