<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>allnova · Instagram · Post rechts (App)</title>
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="ig.css">
<style>
  .feat { position: absolute; left: 440px; top: 492px; width: 560px; display: grid; gap: 26px; }
  .feat > div { display: grid; grid-template-columns: 62px 1fr; gap: 20px; align-items: center; }
  .feat .ic { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 2px rgba(201, 182, 142, .5); background: rgba(201, 182, 142, .08); }
  .feat .ic svg { width: 30px; height: 30px; }
  .feat .t { font-size: 30px; font-weight: 700; letter-spacing: -.012em; line-height: 1.15; color: var(--ivory); }
  .feat .s { margin-top: 3px; font-size: 22px; font-weight: 500; color: rgba(248, 246, 240, .58); }
  #cta { position: absolute; left: 440px; top: 1086px; font-size: 34px; font-weight: 800; letter-spacing: -.02em; color: var(--ivory); white-space: nowrap; }
  #badges { position: absolute; left: 440px; top: 1140px; display: flex; gap: 20px; }
  #badges img { width: 240px; height: 80px; display: block; }
  #fn { position: absolute; left: 440px; top: 1250px; font-size: 18px; font-weight: 500; color: rgba(248, 246, 240, .45); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage" class="post dark">
  <div class="glow" style="left:380px;top:-360px;width:1100px;height:1100px"></div>
  <div class="glow" style="left:-420px;top:640px;width:900px;height:900px;opacity:.7"></div>
  <div class="phone" id="ph" style="transform: translate(-300px, 250px) rotate(-7deg) scale(.44)"></div>

  <div class="eyebrow" style="left:440px;top:110px"><i></i><span data-t="eyebrow"></span></div>
  <div class="h1 fit" data-max="560" style="left:440px;top:160px" data-t="h1"></div>
  <div class="h2 fit gold-text" data-max="590" style="left:436px;top:296px" data-t="h2"></div>
  <div class="feat" id="feat"></div>
  <div id="cta" data-t="cta"></div>
  <div id="badges"><img src="../assets/brand/badge-app-store.png" alt="Download on the App Store"><img src="../assets/brand/badge-google-play.png" alt="Get it on Google Play"></div>
  <div id="fn" data-t="fn"></div>
</div>
<script src="phone.js"></script>
<script>
/* Texte — hier editieren (Funktionen gem. allnova.ch) */
const T = {
  eyebrow: 'Die allnova App',
  h1: 'Alles an',
  h2: 'einem Ort.',
  cta: 'Jetzt kostenlos laden',
  fn: '*Cashback je nach Angebot und Bedingungen. Ansicht mit Demodaten.',
};
const F = [
  ['gift', 'Geschenkkarten', '100+ Marken, mit Cashback*'],
  ['wallet', 'Guthaben im Blick', 'Jeder Vorteil an einem Ort'],
  ['doc', 'Policen & Dokumente', 'Griffbereit statt Papierchaos'],
  ['clock', 'Fristen im Blick', 'Laufzeiten und Termine'],
  ['chat', 'Direkt zu allnova', 'Deine persönliche Beratung'],
];
const ICON = {
  gift: '<rect x="4" y="10" width="22" height="16" rx="3"/><path d="M3 10h24M15 10v16M15 10c-2-5-8-6-8-2 0 2 4 2 8 2zM15 10c2-5 8-6 8-2 0 2-4 2-8 2z"/>',
  wallet: '<rect x="4" y="8" width="22" height="17" rx="3.5"/><path d="M19 15.5h7v-4h-7a2 2 0 0 0 0 4zM8 8l9-4 2.5 4"/>',
  doc: '<path d="M8 4h10l6 6v16H8z"/><path d="M18 4v6h6M12 15h8M12 19.5h8"/>',
  clock: '<circle cx="15" cy="15" r="10.5"/><path d="M15 9v6.5l4.5 2.5"/>',
  chat: '<path d="M6 7h18a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-9l-6 4v-4H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><path d="M10 13h10M10 17h6"/>',
};
document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T[el.dataset.t]; });
document.getElementById('feat').innerHTML = F.map(([i, t, s]) => `<div><span class="ic"><svg viewBox="0 0 30 30" fill="none" stroke="#d8c7a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[i]}</svg></span><div><div class="t">${t}</div><div class="s">${s}</div></div></div>`).join('');
document.getElementById('ph').innerHTML = phone('entdecken');
window.ready.then(() => {
  document.querySelectorAll('.fit').forEach((el) => {
    const r = document.createRange(); r.selectNodeContents(el); const w = r.getBoundingClientRect().width;
    const max = +el.dataset.max; if (w > max) el.style.fontSize = `${parseFloat(getComputedStyle(el).fontSize) * max / w}px`;
  });
  document.body.dataset.ready = '1';
});
</script>
</body>
</html>
