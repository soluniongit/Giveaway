<link rel="stylesheet" href="../assets/base.css">

<style>
  /* Präsentation 4:5, iPhone mit nachgebautem Instagram-Profil (Besucheransicht).
     Profildaten und Bio wie auf instagram.com/allnova.ch; das Raster zeigt die drei fixierten Beiträge
     aus out/instagram/ (vorher `npm run instagram` ausführen). */
  #stage.mock { width: 1440px; height: 1800px; }
  .scr { background: #fff; }
  /* Bildschirm in iOS-Punkten (390 × 844), per scale(3) auf App-Pixel @3x */
  #ig { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform: scale(3); transform-origin: 0 0;
    font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif; color: #000; font-size: 14px; letter-spacing: -.01em; }
  #ig * { position: absolute; margin: 0; box-sizing: border-box; }
  #ig .bio span, #ig .bio svg { position: static; }
  #ig .em { font-family: 'Noto Color Emoji', 'Apple Color Emoji', sans-serif; font-size: 13px; margin-right: 4px; }
  .sb-time { left: 0; width: 108px; top: 16px; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
  .stat { width: 84px; text-align: center; top: 120px; }
  #ig .stat b { position: static; display: block; font-size: 17px; font-weight: 700; line-height: 21px; }
  #ig .stat span { position: static; display: block; font-size: 13.5px; line-height: 18px; }
  .bio { left: 16px; top: 206px; width: 358px; line-height: 18px; }
  #ig .bio div { position: static; white-space: nowrap; }
  .btn { top: 368px; height: 32px; border-radius: 8px; font-size: 14px; font-weight: 600; line-height: 32px; text-align: center; }
  .tile { width: 129px; height: 172px; overflow: hidden; background: #eee; }
  .tile img { left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile svg { right: 7px; top: 7px; filter: drop-shadow(0 0 2px rgba(0, 0, 0, .45)); }
</style>
</head>

<script>
