<script>
/* ============================================================
 * Bildschirmtexte — hier editieren.
 * App-Oberflächen: echte Screenshots als feste Bildebenen; persönliche Felder sind
 * aus den Pixeln entfernt und durch Demowerte ersetzt (siehe app/build-assets.py).
 * ============================================================ */
const C = {
  h_mehr: 'Mehr', h_w0: 'sparen.', h_w1: 'Überblick.', h_w2: 'für dich.',
  s2_l1: 'Über 100 Marken.', s2_l2: 'Eine App.',
  foot: '*Cashback je nach Angebot und Bedingungen.',
  s3_l1: 'Geschenkkarten kaufen.', s3_l2: 'Cashback sichern.*',
  s4_l1: 'Dein Guthaben.', s4_l2: 'Immer im Blick.',
  s5_l1: 'Policen & Dokumente.', s5_l2: 'An einem Ort.',
  s6_l1: 'Fragen?', s6_l2: 'Direkt zu allnova.',
  m1: 'Sparen.', m2: 'Überblicken.', m3: 'Entdecken.',
  end_l1: 'Jetzt kostenlos', end_l2: 'herunterladen.',
  url: 'ALLNOVA.CH',
  demo: 'Demodaten',
  // Demowerte in der App-Oberfläche
  avatar: 'A', home_hi: 'Willkommen zurück', home_name: 'Alex',
  points: 48.2,
  docs: ['DEMO-001', 'DEMO-002', 'DEMO-003'], date_mask: '••.••.••••', prem_mask: '•••.•• CHF/Jahr',
};
applyTexts(C);

// ---- Markup, das mehrfach vorkommt ----
const TILE_NAMES = ['decathlon', 'sony', 'sky', 'hm', 'xbox', 'zalando'];
const TILE_POS = [[36, 142], [592, 142], [36, 857], [592, 857], [36, 1572], [592, 1572]];
document.getElementById('phA-cards').innerHTML = TILE_NAMES.map((n, i) =>
  `<img class="lay ent-card" src="img/ent-card-${n}.png" alt="" style="left:${TILE_POS[i][0] - 6}px;top:${TILE_POS[i][1] - 6}px;transform-origin:50% 40%">`).join('');

// Dokumentkarten: Bild + Demowerte (Kartenkoordinaten; Grundlinien 194 / 261 / 261)
const docOv = (k) => `
  <div class="ov ov-nr" style="left:439px;top:${194 - 0.85 * 34.5}px">${C.docs[k]}</div>
  <div class="ov ov-date" style="left:424px;top:${261 - 0.85 * 34.5}px">${C.date_mask}</div>
  <div class="ov ov-prem" style="right:52px;top:${261 - 0.85 * 36}px">${C.prem_mask}</div>`;
document.getElementById('phB-cards').innerHTML = [0, 1, 2].map((k) =>
  `<div class="lay doc-card" style="left:30px;top:${604 + 315 * k}px;width:1110px;height:325px"><img src="img/doc-card-${k + 1}.png" alt="" style="display:block">${docOv(k)}</div>`).join('');
// Vollbild-Variante (Montage): gleiche Werte in Bildschirmkoordinaten
document.getElementById('phL-ov').innerHTML = [0, 1, 2].map((k) =>
  `<div class="lay" style="left:30px;top:${604 + 315 * k}px;width:1110px;height:325px">${docOv(k)}</div>`).join('');

// Hook: drei Reihen Gutscheinkacheln
// Gutscheinkacheln aus der App, je Reihe versetzt, damit keine Marke gehäuft nebeneinander steht
const STREAM = [
  ['zalando', 'sony', 'hm', 'xbox', 'decathlon', 'sky'],
  ['decathlon', 'xbox', 'sky', 'zalando', 'hm', 'sony'],
  ['sky', 'hm', 'decathlon', 'sony', 'zalando', 'xbox'],
  ['xbox', 'zalando', 'sony', 'sky', 'decathlon', 'hm'],
];
document.getElementById('stream').innerHTML = [0, 1, 2, 3].map((r) =>
  `<div class="srow" id="sr${r}" style="top:${r * 214}px">${Array.from({ length: 10 }, (_, i) => `<img src="img/tile-${STREAM[r][i % 6]}.png" alt="">`).join('')}</div>`).join('');

defineComposition({
  duration: 30,
  fps: 30,
  build() {
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => [...document.querySelectorAll(s)];
    const inner = (sel) => $$(sel).map((el) => el.firstElementChild);
    const B = 60 / 116; // ein Schlag bei 116 BPM

    // Headlines auf max. 900 px Breite einpassen (deterministisch, nach dem Laden der Schriften)
    $$('.l1, .l2, .mw').forEach((el) => {
      const sp = el.firstElementChild;
      const r = document.createRange(); r.selectNodeContents(sp); const w = r.getBoundingClientRect().width;
      const max = el.classList.contains('l2') || el.id === 'mw3' ? 930 : 900;
      if (w > max) el.style.fontSize = `${parseFloat(getComputedStyle(el).fontSize) * (max / w)}px`;
    });
    // Emoji direkt hinter dem (anonymisierten) Namen
    $('#home-emo').style.left = `${222.5 + $('#home-name').getBoundingClientRect().width / 1 + 28}px`;

    const P = (sc, cx, top) => ({ x: cx - 645 * sc, y: top, scale: sc });

    // ---------- Startzustände ----------
    gsap.set(inner('.mask'), { yPercent: 175 });
    gsap.set('.phone, .ui', { transformOrigin: '0 0' });
    gsap.set('#phA', { ...P(0.52, 540, 2000) });
    gsap.set('.ent-card', { scale: 0.86, opacity: 0, y: 40 });
    gsap.set('#fl-t1', { x: -560, y: 1060, rotation: -14, scale: 0.44 });
    gsap.set('#fl-t2', { x: 1100, y: 1330, rotation: 12, scale: 0.44 });
    gsap.set('#fl-b1', { x: -360, y: 1590, rotation: -6, scale: 0.62 });
    gsap.set('#fl-b2', { x: 1080, y: 860, rotation: 8, scale: 0.62 });
    gsap.set('#detail', { opacity: 0 });
    gsap.set('#ring1, #ring2', { opacity: 0 });
    gsap.set(['#w-head', '#w-btn', '#w-tab', '#w-nav'], { x: 72, scale: 0.8, opacity: 0 });
    gsap.set('#w-head', { y: 960 });
    gsap.set('#w-btn', { y: 908, x: 260 });
    gsap.set('#w-tab', { y: 1056, x: 260 });
    gsap.set('#w-nav', { y: 1210, x: 260 });
    gsap.set(['#tag4', '#tag5'], { opacity: 0, y: 20 });
    gsap.set('#tag4', { left: 92, top: 1420 });
    gsap.set('#tag5', { left: 92, top: 500 });
    gsap.set('#phB', { ...P(0.55, 540, 2000) });
    gsap.set('.doc-card', { x: 1240, opacity: 0 });
    gsap.set('#home', { x: 1180, y: 860, scale: 0.82 });
    gsap.set('#h-nav', { x: 1180, y: 1236, scale: 0.82 });
    gsap.set('.wa-ring', { scale: 0.6, opacity: 0 });
    gsap.set('#tap', { scale: 0.3, opacity: 0 });
    gsap.set('#phC', { ...P(0.46, 540, 2000) });
    gsap.set('#phL', { ...P(0.38, 270, 2000), rotation: -9 });
    gsap.set('#phR', { ...P(0.38, 810, 2000), rotation: 9 });
    gsap.set('#e-logo', { opacity: 0, y: 30, scale: 0.94, transformOrigin: '50% 50%' });
    gsap.set('#cta', { opacity: 0 });
    gsap.set('#cta img', { y: 30, opacity: 0 });
    gsap.set('#h-logo', { opacity: 0 });

    const tl = gsap.timeline({ defaults: { ease: 'expo.out', duration: 1 } });
    const pts = { v: 0 };
    const reveal = (sel, at, o = {}) => tl.to(inner(sel), { yPercent: 0, duration: 0.9, ease: 'expo.out', stagger: 0.08, ...o }, at);
    const hide = (sel, at, o = {}) => tl.to(inner(sel), { yPercent: -45, opacity: 0, duration: 0.38, ease: 'power3.in', stagger: 0.04, ...o }, at);
    const gold = (sel, at, d = 2.4) => tl.to(inner(sel), { backgroundPosition: '100% 0', duration: d, ease: 'sine.inOut' }, at);

    tl.to('#blobA', { x: 260, y: 240, duration: 27, ease: 'sine.inOut' }, 0);
    tl.to('#blobB', { x: -300, y: -240, duration: 27, ease: 'sine.inOut' }, 0);

    // ================= 0 – 2.6 s · Hook =================
    tl.fromTo('#sr0', { x: -200 }, { x: -1250, duration: 3.2, ease: 'none' }, 0);
    tl.fromTo('#sr1', { x: -1400 }, { x: -300, duration: 3.2, ease: 'none' }, 0);
    tl.fromTo('#sr2', { x: -150 }, { x: -1350, duration: 3.2, ease: 'none' }, 0);
    tl.fromTo('#sr3', { x: -1300 }, { x: -350, duration: 3.2, ease: 'none' }, 0);
    tl.fromTo('#stream', { scale: 1.18 }, { scale: 1, duration: 3.2, ease: 'power2.out' }, 0);
    reveal('#h-mehr', 0.12, { duration: 0.7 });
    reveal('#hw0', 0.32, { duration: 0.6 });
    hide('#hw0', 0.32 + 1.5 * B - 0.2, { duration: 0.28 });
    reveal('#hw1', 0.32 + 1.5 * B, { duration: 0.6 });
    hide('#hw1', 0.32 + 3 * B - 0.2, { duration: 0.28 });
    reveal('#hw2', 0.32 + 3 * B, { duration: 0.7 });
    tl.to('#h-logo', { opacity: 0.9, duration: 0.6, ease: 'power1.out' }, 0.5);
    gold('#hw0, #hw1, #hw2', 0.3, 2.3);
    // Kreis-Wipe auf Elfenbein
    tl.fromTo('#hook', { clipPath: 'circle(150% at 50% 56%)' }, { clipPath: 'circle(0% at 50% 56%)', duration: 0.62, ease: 'power3.inOut' }, 2.42);
    tl.set('#hook', { visibility: 'hidden' }, 3.06);

    // ================= 2.6 – 6.7 s · Marken =================
    const t2 = 2.6;
    reveal('#s2-l1', t2 + 0.05);
    reveal('#s2-l2', t2 + 0.3);
    gold('#s2-l2', t2 + 0.5, 3.0);
    tl.fromTo('#phA', { ...P(0.52, 540, 2000), rotation: 4 }, { ...P(0.52, 540, 640), rotation: 0, duration: 1.15, ease: 'expo.out' }, t2 - 0.08);
    TILE_NAMES.forEach((n, i) => tl.to(`.ent-card:nth-child(${i + 1})`, { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: 'back.out(1.5)' }, t2 + 0.42 + i * (B / 2)));
    // schwebende Kacheln rund ums Telefon (Tiefe)
    tl.to('#fl-t1', { x: -160, y: 980, rotation: -9, duration: 1.1 }, t2 + 0.7);
    tl.to('#fl-t2', { x: 600, y: 1290, rotation: 8, duration: 1.1 }, t2 + 0.85);
    tl.to('#fl-b1', { x: -40, y: 1560, rotation: -5, duration: 1.0 }, t2 + 1.1);
    tl.to('#fl-b2', { x: 800, y: 860, rotation: 6, duration: 1.0 }, t2 + 1.2);
    tl.to('#fl-t1', { y: '-=60', rotation: -6, duration: 1.9, ease: 'sine.inOut' }, t2 + 1.8);
    tl.to('#fl-t2', { y: '-=80', rotation: 5, duration: 1.8, ease: 'sine.inOut' }, t2 + 1.9);
    tl.to('#fl-b1', { y: '-=50', duration: 1.6, ease: 'sine.inOut' }, t2 + 2.1);
    tl.to('#fl-b2', { y: '+=60', duration: 1.5, ease: 'sine.inOut' }, t2 + 2.2);
    tl.to('#phA', { y: 600, duration: 2.9, ease: 'sine.inOut' }, t2 + 1.1);
    reveal('#foot', t2 + 0.9);

    // ================= 6.7 – 10.3 s · Cashback =================
    const t3 = 6.72;
    hide('#s2-l1, #s2-l2', t3 - 0.3);
    reveal('#s3-l1', t3 + 0.08);
    reveal('#s3-l2', t3 + 0.3);
    gold('#s3-l2', t3 + 0.5, 2.6);
    tl.to('#fl-t1', { x: -700, rotation: -20, duration: 0.6, ease: 'power3.in' }, t3 - 0.25);
    tl.to('#fl-b1', { x: -600, duration: 0.6, ease: 'power3.in' }, t3 - 0.2);
    tl.to('#fl-t2', { x: 1300, rotation: 18, duration: 0.6, ease: 'power3.in' }, t3 - 0.25);
    tl.to('#fl-b2', { x: 1300, duration: 0.6, ease: 'power3.in' }, t3 - 0.2);
    // Match-Cut: Zalando-Kachel löst sich aus dem Telefon und wird gross (gleicher Ausschnitt, nur skaliert)
    {
      const s = 0.52; const ph = { x: 540 - 645 * s, y: 600 };
      const sx = ph.x + (60 + 576) * s; const sy = ph.y + (60 + 1556) * s;
      tl.set('#detail', { x: sx, y: sy, scale: s, opacity: 1 }, t3);
      tl.set('.ent-card:nth-child(6)', { opacity: 0 }, t3);
      tl.to('#detail', { x: 540 - 574 * 1.26 / 2, y: 640, scale: 1.26, duration: 1.0, ease: 'expo.inOut' }, t3);
      tl.to('#phA', { scale: 0.47, x: 540 - 645 * 0.47, y: 760, opacity: 0, duration: 0.9, ease: 'power3.inOut' }, t3 + 0.05);
    }
    // Cashback-Moment: Glanz über das Badge + goldene Ringe
    const badgeC = { x: 540 - 574 * 1.26 / 2 + (16 + 151) * 1.26, y: 640 + (571 + 38) * 1.26 };
    ['#ring1', '#ring2'].forEach((id, i) => {
      tl.set(id, { left: badgeC.x - 200, top: badgeC.y - 200, width: 400, height: 400, opacity: 0.9, scale: 0.4 }, t3 + 1.15 + i * 0.22);
      tl.to(id, { scale: 1.6, opacity: 0, duration: 1.1, ease: 'power2.out' }, t3 + 1.15 + i * 0.22);
    });
    tl.fromTo('#shine i', { x: 0 }, { x: 520, duration: 0.8, ease: 'power2.inOut' }, t3 + 1.12);
    tl.to('#detail', { scale: 1.3, x: 540 - 574 * 1.3 / 2, y: 626, duration: 2.2, ease: 'sine.inOut' }, t3 + 1.0);

    // ================= 10.3 – 14.5 s · Wallet =================
    const t4 = 10.34;
    hide('#s3-l1, #s3-l2, #foot', t4 - 0.3);
    tl.to('#detail', { x: -900, rotation: -8, duration: 0.6, ease: 'power3.in' }, t4 - 0.3);
    reveal('#s4-l1', t4 + 0.08);
    reveal('#s4-l2', t4 + 0.3);
    gold('#s4-l2', t4 + 0.5, 2.6);
    tl.to('#w-head', { y: 640, opacity: 1, duration: 0.9 }, t4 + 0.05);
    tl.to(pts, { v: C.points, duration: 1.0, ease: 'power3.out' }, t4 + 0.5);
    tl.to('#w-btn', { x: 72, opacity: 1, duration: 0.7 }, t4 + 2 * B);
    tl.to('#w-tab', { x: 72, opacity: 1, duration: 0.7 }, t4 + 3 * B);
    tl.to('#w-nav', { x: 72, opacity: 1, duration: 0.7 }, t4 + 4 * B);
    tl.to('#tag4', { opacity: 1, y: 0, duration: 0.6 }, t4 + 0.8);
    tl.to(['#w-head', '#w-btn', '#w-tab', '#w-nav'], { y: '-=26', duration: 2.3, ease: 'sine.inOut' }, t4 + 1.4);

    // ================= 14.5 – 18.6 s · Dokumente =================
    const t5 = 14.48;
    hide('#s4-l1, #s4-l2', t5 - 0.3);
    tl.to('#tag4', { opacity: 0, duration: 0.3, ease: 'power1.in' }, t5 - 0.3);
    tl.to(['#w-head', '#w-btn', '#w-tab', '#w-nav'], { y: 2300, duration: 0.6, ease: 'power3.in', stagger: 0.04 }, t5 - 0.3);
    reveal('#s5-l1', t5 + 0.08);
    reveal('#s5-l2', t5 + 0.3);
    gold('#s5-l2', t5 + 0.5, 2.6);
    tl.fromTo('#phB', { ...P(0.55, 540, 2000), rotation: -4 }, { ...P(0.55, 540, 620), rotation: 0, duration: 1.0 }, t5);
    $$('.doc-card').forEach((el, k) => tl.to(el, { x: 0, opacity: 1, duration: 0.75, ease: 'expo.out' }, t5 + 0.62 + k * B));
    tl.to('#tag5', { opacity: 1, y: 0, duration: 0.6 }, t5 + 0.9);
    tl.to('#phB', { ...P(0.58, 540, 590), duration: 2.8, ease: 'sine.inOut' }, t5 + 0.9);

    // ================= 18.6 – 21.7 s · Kontakt =================
    const t6 = 18.62;
    hide('#s5-l1, #s5-l2', t6 - 0.3);
    tl.to('#tag5', { opacity: 0, duration: 0.3, ease: 'power1.in' }, t6 - 0.3);
    tl.to('#phB', { y: 2100, rotation: 5, duration: 0.6, ease: 'power3.in' }, t6 - 0.35);
    reveal('#s6-l1', t6 + 0.08);
    reveal('#s6-l2', t6 + 0.3);
    gold('#s6-l2', t6 + 0.5, 2.4);
    tl.to('#home', { x: 60, duration: 0.9 }, t6 + 0.05);
    tl.to('#h-nav', { x: 60, duration: 0.9 }, t6 + 0.2);
    tl.to('#tap', { scale: 1, opacity: 1, duration: 0.3, ease: 'power2.out' }, t6 + 2 * B);
    tl.to('#tap', { scale: 1.3, opacity: 0, duration: 0.5, ease: 'power2.out' }, t6 + 2 * B + 0.3);
    tl.to('#wa', { scale: 1.22, transformOrigin: '50% 50%', duration: 0.25, ease: 'power2.out' }, t6 + 2 * B + 0.1);
    tl.to('#wa', { scale: 1, duration: 0.6, ease: 'elastic.out(1, .5)' }, t6 + 2 * B + 0.35);
    ['#war1', '#war2'].forEach((id, i) => tl.fromTo(id, { scale: 0.6, opacity: 0.9 }, { scale: 2.6, opacity: 0, duration: 1.1, ease: 'power2.out' }, t6 + 2 * B + 0.15 + i * 0.25));
    tl.to(['#home', '#h-nav'], { y: '-=24', duration: 1.9, ease: 'sine.inOut' }, t6 + 0.9);

    // ================= 21.7 – 25.3 s · Montage =================
    const t7 = 21.72;
    hide('#s6-l1, #s6-l2', t7 - 0.3);
    tl.to(['#home', '#h-nav'], { x: -1200, duration: 0.55, ease: 'power3.in', stagger: 0.05 }, t7 - 0.3);
    reveal('#mw1', t7 + 0.05, { duration: 0.6 });
    reveal('#mw2', t7 + 0.05 + B, { duration: 0.6 });
    reveal('#mw3', t7 + 0.05 + 2 * B, { duration: 0.7 });
    gold('#mw3', t7 + 1.0, 2.2);
    tl.to('#phC', { ...P(0.46, 540, 700), duration: 0.9 }, t7 + 0.05);
    tl.to('#phL', { ...P(0.38, 250, 800), rotation: -9, duration: 0.9 }, t7 + 0.05 + B);
    tl.to('#phR', { ...P(0.38, 830, 800), rotation: 9, duration: 0.9 }, t7 + 0.05 + 2 * B);
    tl.to('#phC', { y: 660, duration: 2.4, ease: 'sine.inOut' }, t7 + 0.9);
    tl.to('#phL', { y: 770, rotation: -11, duration: 1.6, ease: 'sine.inOut' }, t7 + 0.05 + B + 0.9);
    tl.to('#phR', { y: 770, rotation: 11, duration: 1.2, ease: 'sine.inOut' }, t7 + 0.05 + 2 * B + 0.9);

    // ================= 25.3 – 30 s · Endcard =================
    const t8 = 25.34;
    hide('#mw1, #mw2, #mw3', t8 - 0.3);
    tl.to('#phL', { y: 2100, rotation: -16, duration: 0.6, ease: 'power3.in' }, t8 - 0.3);
    tl.to('#phR', { y: 2100, rotation: 16, duration: 0.6, ease: 'power3.in' }, t8 - 0.26);
    tl.to('#phC', { y: 2100, duration: 0.6, ease: 'power3.in' }, t8 - 0.2);
    tl.to('#e-logo', { opacity: 1, y: 0, scale: 1, duration: 1.0 }, t8 + 0.1);
    reveal('#e-l1', t8 + 0.3);
    reveal('#e-l2', t8 + 0.45);
    gold('#e-l2', t8 + 0.7, 1.6);
    tl.to('#cta', { scale: 1, opacity: 1, duration: 0.01 }, t8 + 0.75);
    tl.to('#cta img', { y: 0, opacity: 1, duration: 0.8, ease: 'expo.out', stagger: 0.12 }, t8 + 0.75);
    reveal('#e-url', t8 + 1.0);
    // ab ~26.6 s steht das Endbild ruhig bis 30 s

    return {
      timeline: tl,
      onSeek() { $('#w-pts').textContent = `${pts.v.toFixed(2)} Punkte`; },
    };
  },
});
</script>
</body>
</html>
