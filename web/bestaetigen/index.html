<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teilnahme bestätigen | allnova Gewinnspiel</title>
<meta name="robots" content="noindex">
<link rel="preload" href="../assets/fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  body { min-height: 100svh; display: grid; place-items: center; transition: background-color .8s; }
  .confirm { width: min(100% - 40px, 720px); padding: clamp(32px, 6vw, 72px) 0; display: grid; gap: 26px; justify-items: center; text-align: center; }
  .confirm .brand { margin-bottom: 18px; }
  .seal { width: 128px; height: 128px; }
  .confirm h1 { font-weight: 800; letter-spacing: -.035em; line-height: 1.02; font-size: clamp(40px, 6vw, 72px); }
  .confirm .lead { margin: 0 auto; max-width: 46ch; }
  .app { width: 100%; display: grid; gap: 18px; justify-items: center; padding: clamp(26px, 4vw, 40px); border-radius: var(--r-l); background: var(--surface); box-shadow: var(--shadow); }
  .theme-dark .app { box-shadow: inset 0 0 0 1.5px var(--line-2); }
  .app .h3 { max-width: 24ch; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .invite { width: 100%; display: grid; gap: 16px; justify-items: center; padding: clamp(26px, 4vw, 40px); border-radius: var(--r-l); background: color-mix(in srgb, var(--gold) 11%, var(--surface)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--gold) 40%, transparent); }
  .invite .tickets { width: 150px; }
  .invite .h3 { max-width: 22ch; }
  .invite p { margin: 0; max-width: 48ch; }
  .link-row { width: 100%; max-width: 520px; display: flex; gap: 8px; padding: 6px; border-radius: 999px; background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--line-2); }
  .link-row input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 14px; font: inherit; font-size: 15px; font-weight: 600; color: var(--text); text-overflow: ellipsis; }
  .link-row input:focus { outline: none; }
  .link-row button { flex: none; height: 44px; padding: 0 18px; border: 0; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; background: var(--text); color: var(--bg); }
  .bonus-status { display: inline-flex; gap: 10px; align-items: center; padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; background: var(--bg-2); }
  .bonus-status i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .bonus-status.is-active { background: var(--gold-grad); color: #111512; }
  .bonus-status.is-active i { background: #111512; }
  @media (max-width: 420px) { .link-row { flex-direction: column; border-radius: 22px; } .link-row input { height: 40px; text-align: center; } }
  .spinner { width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--gold); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="theme-ivory">
<main class="confirm" aria-live="polite">
  <span class="brand"><img src="../assets/brand/allnova-logo-hell.png" data-logo alt="allnova" width="2140" height="375" style="height: 24px; width: auto"></span>
  <div data-view="loading"><div class="spinner" role="status" aria-label="Wird bestätigt"></div></div>
  <p class="lead" data-view="loading">Wir bestätigen deine Teilnahme …</p>
</main>

<script src="../assets/js/config.js"></script>
<script src="../assets/vendor/gsap.min.js"></script>
<script src="../assets/vendor/DrawSVGPlugin.min.js"></script>
<script type="module">
import { confirmEntry, track, DEMO } from '../assets/js/api.js';

const { gsap } = window;
gsap.registerPlugin(window.DrawSVGPlugin);
const cfg = window.ALLNOVA_CONFIG || {};
const main = document.querySelector('.confirm');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (d) => (d ? new Date(`${d}T12:00:00`).toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '');
const PAGES = { steuer: '../steuern/', fahrstart: '../fahrstart/' };
const seal = `<svg class="seal" viewBox="0 0 128 128" aria-hidden="true"><circle class="s-ring" cx="64" cy="64" r="58" fill="none" stroke="#b69a5c" stroke-width="5"/><circle class="s-fill" cx="64" cy="64" r="50" fill="#b69a5c"/><path class="s-check" d="M42 65l15 15 30-33" fill="none" stroke="#111512" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const arrow = '<span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';

function render(html, kind) {
  if (kind === 'fahrstart') {
    document.body.classList.replace('theme-ivory', 'theme-dark');
    document.querySelector('[data-logo]').src = '../assets/brand/allnova-logo.png';
  }
  main.querySelectorAll('[data-view]').forEach((el) => el.remove());
  main.insertAdjacentHTML('beforeend', html);
  gsap.from(main.querySelectorAll('[data-view="result"] > *, [data-view="result"]'), { opacity: 0, y: 26, duration: 1, ease: 'expo.out', stagger: 0.07 });
  const ring = main.querySelector('.s-ring');
  if (ring) {
    gsap.timeline()
      .from(ring, { drawSVG: '0%', duration: 1.1, ease: 'power2.inOut' })
      .from(main.querySelector('.s-fill'), { scale: 0, transformOrigin: '50% 50%', duration: 0.6, ease: 'back.out(1.8)' }, 0.6)
      .from(main.querySelector('.s-check'), { drawSVG: '0%', duration: 0.5, ease: 'power2.out' }, 0.95);
  }
}

// Persönlicher Einladungslink: Bonuslos, sobald eine eingeladene Person gültig teilnimmt
const tickets = (active) => `<svg class="tickets${active ? ' is-active' : ''}" viewBox="0 0 132 84" aria-hidden="true"><g transform="translate(6 30) rotate(-8)"><path class="t1" d="M6 0h52a6 6 0 0 1 6 6v8a6 6 0 0 0 0 12v8a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6v-8a6 6 0 0 0 0-12V6a6 6 0 0 1 6-6z"/><path class="t1-l" d="M44 6v28"/><text x="22" y="25" class="t1-x">1</text></g><g class="t2g" transform="translate(62 12) rotate(9)"><path class="t2" d="M6 0h52a6 6 0 0 1 6 6v8a6 6 0 0 0 0 12v8a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6v-8a6 6 0 0 0 0-12V6a6 6 0 0 1 6-6z"/><text x="32" y="26" class="t2-x">+1</text></g></svg>`;
const SHARE_TEXT = {
  steuer: 'Ich mache beim allnova Steuergewinnspiel mit – zu gewinnen gibt es 3 Jahre Steuererklärung. Mach auch mit:',
  fahrstart: 'Beim allnova Fahrstart-Gewinnspiel gibt es Fahrlektionen und einen VKU-Kursplatz zu gewinnen. Mach auch mit:',
};
function inviteCard(r, back) {
  const slot = main.querySelector('[data-invite-slot]');
  const url = new URL(back, location.href);
  url.search = new URLSearchParams({ ref: r.share_code, utm_source: 'einladung', utm_medium: 'referral' }).toString();
  const link = url.toString();
  const text = SHARE_TEXT[r.kind] || 'Mach mit beim allnova Gewinnspiel:';
  const active = (r.bonus_entries || 0) >= (r.bonus_max || 1);
  slot.className = 'invite';
  slot.hidden = false;
  slot.innerHTML = `${tickets(active)}
    <p class="eyebrow" style="margin:0">Doppelte Chance</p>
    <p class="h3">${active ? 'Bonuslos aktiv – deine Chance ist verdoppelt.' : 'Verdopple deine Gewinnchance.'}</p>
    <p>${active ? 'Danke fürs Weitersagen! Mehr als ein Bonuslos ist nicht möglich – teilen darfst du natürlich trotzdem.' : 'Teile deinen persönlichen Link. Sobald eine Freundin oder ein Freund darüber teilnimmt und die E-Mail bestätigt, erhältst du ein Bonuslos.'}</p>
    <div class="link-row"><input type="text" readonly value="${esc(link)}" aria-label="Dein Einladungslink"><button type="button" data-copy>Kopieren</button></div>
    <div class="actions">
      <button class="btn btn--gold" type="button" data-native-share>Link teilen${arrow}</button>
      <a class="btn btn--ghost" href="https://wa.me/?text=${encodeURIComponent(`${text} ${link}`)}" target="_blank" rel="noopener" data-wa>WhatsApp</a>
    </div>
    <span class="bonus-status${active ? ' is-active' : ''}"><i></i>${active ? 'Bonuslos: aktiv (2 Lose)' : 'Bonuslos: noch offen (1 Los)'}</span>
    <p class="small">Teile den Link nur mit Personen, die sich dafür interessieren – kein Massenversand. Die eingeladene Person nimmt zu den gleichen Bedingungen teil; du erfährst nicht, wer teilgenommen hat. Deinen Status siehst du jederzeit über den Link in deiner Bestätigungsmail. <a href="${back}#bedingungen">Teilnahmebedingungen, Ziffer 9</a></p>`;
  const input = slot.querySelector('input');
  input.addEventListener('focus', () => input.select());
  const copyBtn = slot.querySelector('[data-copy]');
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(link); } catch (e) { input.select(); document.execCommand?.('copy'); }
    copyBtn.textContent = 'Kopiert ✓';
    setTimeout(() => { copyBtn.textContent = 'Kopieren'; }, 1800);
    track(r.campaign, 'invite_copy');
  });
  const shareBtn = slot.querySelector('[data-native-share]');
  if (!navigator.share) shareBtn.hidden = true;
  shareBtn.addEventListener('click', async () => {
    track(r.campaign, 'invite_share');
    try { await navigator.share({ title: r.campaign_title, text, url: link }); } catch (e) { /* abgebrochen */ }
  });
  slot.querySelector('[data-wa]').addEventListener('click', () => track(r.campaign, 'invite_whatsapp'));

  const t = slot.querySelector('.tickets');
  gsap.timeline({ delay: 0.5 })
    .from(t.querySelector('g'), { y: 18, rotation: -20, opacity: 0, transformOrigin: '50% 50%', duration: 0.9, ease: 'expo.out' })
    .from(t.querySelector('.t2g'), { x: -30, rotation: -12, opacity: 0, transformOrigin: '50% 50%', duration: 1, ease: 'back.out(1.7)' }, 0.25)
    .from(slot.querySelector('.bonus-status'), { scale: 0.8, opacity: 0, duration: 0.6, ease: 'back.out(2)' }, 0.6);
}

const token = new URLSearchParams(location.search).get('token') || '';
let r;
try { r = await confirmEntry(token); } catch (e) { r = { ok: false, error: 'network' }; }
const back = PAGES[r.kind] || '../';

if (r.ok) {
  const again = r.status === 'already_confirmed';
  const appBtn = cfg.appUrl
    ? `<a class="btn btn--gold" href="${esc(cfg.appUrl)}" data-app>allnova App entdecken${arrow}</a>`
    : (DEMO ? '<p class="small">Vorschau: Der App-Link wird in <code>assets/js/config.js</code> (appUrl) hinterlegt.</p>' : '');
  render(`<div data-view="result" style="display:grid;gap:22px;justify-items:center">
      ${seal}
      <h1>${again ? 'Du bist bereits dabei.' : 'Deine Teilnahme ist bestätigt.'}</h1>
      <p class="lead">${r.first_name ? `${esc(r.first_name)}, du` : 'Du'} nimmst am ${esc(r.campaign_title)} teil.${r.draw_on ? ` Die Auslosung findet am ${fmtDate(r.draw_on)} statt.` : ''} Viel Glück!</p>
    </div>
    <div data-view="result" data-invite-slot hidden></div>
    <div class="app" data-view="result">
      <p class="h3">Entdecke jetzt regionale Vorteile in der allnova App.</p>
      <div class="actions">${appBtn}<a class="btn btn--ghost" href="${back}" data-later>Später</a></div>
      <p class="small">${r.share_code ? 'Zusätzliche Lose gibt es nur über deinen Einladungslink – nicht für App, Newsletter oder Beratung.' : 'Für Installation, Newsletter oder Beratung gibt es keine zusätzlichen Lose.'}</p>
    </div>`, r.kind);
  if (r.share_code) inviteCard(r, back);
  main.querySelector('[data-app]')?.addEventListener('click', () => track(r.campaign, 'app_cta_click'));
  main.querySelector('[data-later]')?.addEventListener('click', () => track(r.campaign, 'app_later_click'));
} else {
  const T = {
    expired: ['Der Bestätigungslink ist abgelaufen.', 'Die Bestätigung muss innerhalb der Teilnahmefrist erfolgen. Läuft das Gewinnspiel noch, kannst du dich erneut eintragen – du erhältst dann einen neuen Link.'],
    invalid_token: ['Dieser Link ist leider ungültig.', 'Bitte öffne den Link direkt aus deiner Bestätigungsmail. Falls es weiterhin nicht klappt, melde dich unter info@allnova.ch.'],
    network: ['Das hat nicht geklappt.', 'Bitte prüfe deine Internetverbindung und lade die Seite neu.'],
  };
  const [h, p] = T[r.error] || T.invalid_token;
  render(`<div data-view="result" style="display:grid;gap:22px;justify-items:center">
      <h1>${h}</h1><p class="lead">${p}</p>
      <div class="actions"><a class="btn btn--gold" href="${back}">Zur Gewinnspielseite${arrow}</a></div>
    </div>`, r.kind);
}
</script>
</body>
</html>
